name: SACPulse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Backend TypeScript Strict Build
        working-directory: backend
        run: npm run build

      - name: Run Deterministic 3-Tier Backend Test Suite (In-Memory Persistence)
        working-directory: backend
        env:
          PERSISTENCE_DRIVER: memory
          JWT_SECRET: ci-deterministic-hmac-sha256-secret-key
          INITIAL_ADMIN_EMAIL: admin@iiita.ac.in
          ENABLE_DEMO_AUTH: 'true'
        run: npm run test:memory

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend TypeScript & Vite Production Build
        working-directory: frontend
        run: npm run build

